version: '3.8'

services:
  jenni-app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      # Add your environment variables here
      # - SHOPIFY_API_KEY=your_shopify_api_key
      # - SHOPIFY_API_SECRET=your_shopify_api_secret
      # - SHOPIFY_APP_URL=your_app_url
      # - JENNI_CLIENT_ID=your_jenni_client_id
      # - JENNI_CLIENT_SECRET=your_jenni_client_secret
      # - JENNI_API_HOST=your_jenni_api_host
      # - REDIS_URL=redis://redis:6379
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      - ./examples:/app/examples:ro
      - ./extensions:/app/extensions:ro
      - ./functions:/app/functions:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      # Mount package.json for dependency changes
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Exclude node_modules to use container's version
      - /app/node_modules
    depends_on:
      - redis
    networks:
      - jenni-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jenni-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:

networks:
  jenni-network:
    driver: bridge
